services:
  noema:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://noema:noema@postgres:5432/noema
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    # 5433 наружу, чтобы host-тесты (TEST_DATABASE_URL) могли использовать
    # compose-PG, не конфликтуя с OrbStack-встроенным PG на 5432.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: noema
      POSTGRES_PASSWORD: noema
      POSTGRES_DB: noema
    volumes:
      - noema-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noema -d noema"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  noema-pg: